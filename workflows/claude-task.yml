name: Claude Code Task
on:
  workflow_dispatch:        # lets you trigger it manually from GitHub
    inputs:
      task:
        description: 'What do you want Claude Code to do?'
        required: true

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude -p "${{ github.event.inputs.task }}" --allowedTools "Edit,Read,Write,Bash"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Claude Code: automated changes"
```

**Step 3 — Trigger it from your phone or anywhere**

Go to your GitHub repo → Actions → Claude Code Task → Run workflow → type your task → click Run.

Claude Code runs on GitHub's servers, makes the changes, and commits them back to your repo. Render detects the commit and auto-deploys. You could be on a beach with your phone.

**The practical workflow:**
```
You on phone → GitHub Actions → Claude Code makes changes 
→ commits to GitHub → Render auto-deploys → live in 2 mins
